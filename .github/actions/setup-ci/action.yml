name: Set up Dashboard dependencies
description: Install locked dependencies and optionally restore the pinned Chromium build.
inputs:
  browser:
    description: Install Chromium for visual tests
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - name: Identify pinned browser
      if: inputs.browser == 'true'
      id: browser
      shell: bash
      run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      if: inputs.browser == 'true'
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-macos26-${{ steps.browser.outputs.version }}
    # Idempotent on a cache hit; fills missing executables if necessary.
    - if: inputs.browser == 'true'
      shell: bash
      run: pnpm exec playwright install chromium
