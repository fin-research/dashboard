name: Generate candidate visual baselines
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-baseline-candidates:
    name: Visual baseline candidates
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/hasbai/financial-visual-ci@sha256:c9bf5b87b7fe570b8325227127bda13718071021836560c14924a0c2387b7991
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - name: Require a task branch
        run: test "$GITHUB_REF" != refs/heads/main
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: test "$(pnpm exec playwright --version)" = 'Version 1.63.0'
      - run: pnpm check:quick
      - run: pnpm test:ci-tools
      - run: pnpm check:visual-coverage --candidate
      - run: pnpm exec vite build
      - run: pnpm build:visual
      - run: pnpm test:visual:update
        env:
          VISUAL_COVERAGE_GATE: '1'
      # Review/import this candidate, then require the ordinary merge-group
      # comparison. Repeating the full suite here adds no merge acceptance.
      - run: node scripts/visual-baselines.mjs record
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-candidates
          path: |
            test-results/visual-baseline-candidate.json
            tests/visual/__screenshots__/linux-ci/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-candidate-evidence
          path: |
            playwright-report/
            test-results/
            visual-dist/production-css.json
          retention-days: 14
