name: Generate candidate visual baselines
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-baseline-candidates:
    name: Visual baseline candidates
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Require a task branch
        run: test "$GITHUB_REF" != refs/heads/main
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
        with:
          browser: 'true'
      - run: pnpm check:quick
      - run: pnpm test:ci-tools
      - run: pnpm check:visual-coverage --candidate
      - run: pnpm exec vite build
      - run: pnpm build:visual
      - run: pnpm test:visual:update
        env:
          VISUAL_COVERAGE_GATE: '1'
      - name: Compare candidates without updating
        run: pnpm test:visual
        env:
          VISUAL_COVERAGE_GATE: '1'
      - run: node scripts/visual-baselines.mjs record
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-candidates
          path: |
            test-results/visual-baseline-candidate.json
            tests/visual/__screenshots__/macos-ci/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-candidate-evidence
          path: |
            playwright-report/
            test-results/
            visual-dist/production-css.json
          retention-days: 14
