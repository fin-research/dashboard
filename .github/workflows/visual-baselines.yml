name: Generate candidate visual baselines
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-baseline-candidates:
    name: Visual baseline candidates
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.33.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm test:visual:update
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baseline-candidates
          path: |
            playwright-report/
            test-results/
            tests/visual/__screenshots__/macos-ci/
          retention-days: 14
