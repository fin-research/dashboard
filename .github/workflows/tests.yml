name: Tests and visual regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: Dashboard CI
    # Match the committed native macOS baselines. No containers or login secrets.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global pnpm@10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci-tools
      - run: pnpm check:visual-coverage
      - name: Check types and diff
        run: pnpm check:quick
      - uses: astral-sh/setup-uv@v6
      - run: pnpm test:python
      - run: pnpm test:coverage
      # Types already passed above; the normal pnpm build retains both checks.
      - name: Build production bundle
        run: pnpm exec vite build
      - name: Prepare browser bundle with shipping CSS
        run: pnpm build:visual
      - run: pnpm exec playwright install chromium
      - name: Compare visual baselines
        run: pnpm test:visual
        env:
          VISUAL_COVERAGE_GATE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            coverage/
            playwright-report/
            test-results/
            visual-dist/production-css.json
            tests/visual/__screenshots__/macos-ci/
          retention-days: 14
